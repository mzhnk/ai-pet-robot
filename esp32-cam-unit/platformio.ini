; PlatformIO Project Configuration — AI Pet Robot V2: ESP32-CAM companion unit
;
; A separate board from the main robot (AI-Thinker ESP32-CAM). It runs its
; own firmware: camera + presence detection + MJPEG stream + a WebSocket
; client that reports detection frames to the main robot's vision link.

[env:esp32cam]
platform  = espressif32
board     = esp32cam
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; AI-Thinker boards need PSRAM enabled for frame buffers.
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -Wall

; huge_app: camera firmware does not fit the default partition layout.
board_build.partitions = huge_app.csv

lib_deps =
    links2004/WebSockets@^2.3.7
