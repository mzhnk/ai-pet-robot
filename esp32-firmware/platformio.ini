; PlatformIO Project Configuration — AI Pet Robot V1
; Docs: https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; --- Build flags ---
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -Wall

; --- Libraries (ArduinoJson v7 API used by src/protocol) ---
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    links2004/WebSockets@^2.3.7
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit NeoPixel@^1.12.0

; Native (host) unit tests for protocol / safety logic
[env:native]
platform = native
build_flags = -std=c++17 -Isrc
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
